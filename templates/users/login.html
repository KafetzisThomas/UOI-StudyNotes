{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock title %}

{% block content %}
    <h2>Log in to your account.</h2>
    <form method="POST" action="{% url 'users:login' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button name="submit" class="btn btn-primary w-100">Login</button>
    </form>
{% endblock content %}
