{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}UOI-StudyNotes - New Note{% endblock title %}

{% block content %}
    <h2>New Note:</h2>
    <form action="{% url 'notes:new_note' %}" method='POST' class="form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-secondary w-100">Save Note</button>
    </form>
{% endblock content %}
